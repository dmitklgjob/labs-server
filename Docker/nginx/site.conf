root /srv/frontend;
index index.html;

server_tokens off;

set $private_cache_control "";
add_header Cache-Control $private_cache_control always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; form-action 'self'" always;

location = /labs {
    return 404;
}

location /labs/ {
    return 404;
}

location ~ ^/labs/([a-z0-9-]+)/(.+)$ {
    alias /srv/labs/$1/public/$2;
}

location ~ ^/(?:api(?:/|$)|login$|logout$|token$|authorize$) {
    set $private_cache_control "no-store";
    fastcgi_hide_header Cache-Control;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /srv/backend/public;
    fastcgi_pass php-fpm:9000;
}

location / {
    try_files $uri $uri/ /index.html =404;
}
